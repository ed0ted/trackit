server.port=8080

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/trackit
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.format_sql=true

# so the error message actually gets sent to frontend
server.error.include-message=always

# jwt stuff (should be env variable in real life i know)
trackit.jwt.secret=trackitSuperSecretKeyThatIsLongEnoughForHS256Algorithm2022
trackit.jwt.expirationMs=86400000

trackit.cors.allowed-origin=http://localhost:3000
